<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Kalpurush', 'Siyam Rupali', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: transparent;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
        }

        .login-card {
            padding: 40px 30px;
            position: relative;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
        }

        .login-card::before {
            display: none;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            background: transparent;
            color: #1a237e;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: none;
            border: 2px solid #1a237e;
            border-radius: 50%;
        }

        .login-header h1 {
            color: #1a237e;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: #2c3e50;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 400;
        }

        .login-form {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a237e;
            font-size: 18px;
            opacity: 1;
            width: 20px;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            border: 2px solid #1a237e;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            color: #1a237e;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .form-group input:focus {
            border-color: #2c3e9e;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.15);
        }

        .form-group input::placeholder {
            color: #5a6a8a;
            font-weight: 400;
            opacity: 0.7;
        }

        /* পাসওয়ার্ড টগল বাটন - ইনপুটের ভিতরে */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #1a237e;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
            line-height: 1;
            opacity: 0.7;
            outline: none;
            width: 40px;
            height: 40px;
        }

        .password-toggle:hover {
            opacity: 1;
            background: rgba(26, 35, 126, 0.08);
        }

        .password-toggle:focus {
            outline: 2px solid #1a237e40;
            outline-offset: 2px;
        }

        .password-toggle i {
            pointer-events: none;
            font-size: 18px;
            color: #1a237e;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            letter-spacing: 0.5px;
            border: 2px solid #1a237e;
        }

        .login-btn:hover {
            background: #0f1555;
            border-color: #0f1555;
            transform: scale(1.01);
            box-shadow: 0 6px 18px rgba(26, 35, 126, 0.25);
        }

        .login-btn:disabled {
            background: #aab0c9;
            border-color: #aab0c9;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-spinner {
            display: none !important;
        }

        .error-message {
            background: rgba(255, 235, 235, 0.85);
            backdrop-filter: blur(4px);
            color: #b71c1c;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #b71c1c;
            font-weight: 500;
        }

        .success-message {
            background: rgba(232, 245, 233, 0.85);
            backdrop-filter: blur(4px);
            color: #1e5a2b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #1e5a2b;
            font-weight: 500;
        }

        .security-notice {
            background: rgba(232, 245, 233, 0.5);
            backdrop-filter: blur(2px);
            border: 1px solid #1a237e30;
            border-radius: 8px;
            padding: 15px;
            margin-top: 25px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .security-icon {
            color: #1a237e;
            font-size: 20px;
            flex-shrink: 0;
        }

        .security-content h4 {
            color: #1a237e;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 700;
        }

        .security-content p {
            color: #1a237ecc;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-header h1 {
                font-size: 24px;
            }
            .admin-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            .login-card {
                padding: 20px 16px;
            }
            .login-header h1 {
                font-size: 22px;
            }
            .form-group input {
                padding: 12px 40px 12px 40px;
                font-size: 14px;
            }
            .login-btn {
                padding: 14px;
                font-size: 15px;
            }
            .password-toggle {
                right: 8px;
                padding: 6px;
                font-size: 16px;
                width: 36px;
                height: 36px;
            }
            .password-toggle i {
                font-size: 16px;
            }
            .input-with-icon i {
                font-size: 16px;
                left: 12px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 16px 12px;
            }
            body {
                padding: 10px;
            }
            .password-toggle {
                right: 4px;
                padding: 4px;
                width: 32px;
                height: 32px;
            }
            .password-toggle i {
                font-size: 14px;
            }
        }

        .form-group input:focus {
            animation: none;
        }

        #loadingSpinner {
            display: none !important;
        }
        .login-btn .loading-spinner {
            display: none !important;
        }
        #loginText {
            display: inline !important;
        }
        .login-btn:disabled #loginText {
            display: inline !important;
            opacity: 0.8;
        }
        .login-btn:disabled .loading-spinner {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="admin-icon"><i class="fas fa-crown"></i></div>
                <h1>এডমিন লগইন</h1>
                <p>নিউ ভিশন ট্রেড অ্যাসোসিয়েশন</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">এডমিন ইমেইল</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="adminEmail" name="adminEmail" 
                               placeholder="আপনার এডমিন ইমেইল" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="adminPassword">এডমিন পাসওয়ার্ড</label>
                    <div class="input-with-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="adminPassword" name="adminPassword" 
                               placeholder="আপনার এডমিন পাসওয়ার্ড" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginText"><i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>এডমিন লগইন</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </form>
            <div class="security-notice">
                <div class="security-icon"><i class="fas fa-lock"></i></div>
                <div class="security-content">
                    <h4>সুরক্ষা নোটিশ</h4>
                    <p>শুধুমাত্র অনুমোদিত এডমিন ব্যবহারকারীরা এই প্যানেলে প্রবেশ করতে পারবেন। অনুগ্রহ করে আপনার ক্রেডেনশিয়ালস সতর্কতার সাথে ব্যবহার করুন।</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBnUqarL-c8oEA52EPBCUdoz67kzvsDnM0",
            authDomain: "nvta-f70ed.firebaseapp.com",
            projectId: "nvta-f70ed",
            storageBucket: "nvta-f70ed.firebasestorage.app",
            messagingSenderId: "832906232424",
            appId: "1:832906232424:web:df35b6c489c9c9c03ef1dd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const adminEmail = document.getElementById('adminEmail');
        const adminPassword = document.getElementById('adminPassword');
        const passwordToggle = document.getElementById('passwordToggle');

        // No loading spinner, just disable button
        function showLoading() {
            loginBtn.disabled = true;
        }
        function hideLoading() {
            loginBtn.disabled = false;
        }

        // Password Toggle with Font Awesome - FIXED
        passwordToggle.addEventListener('click', function(e) {
            e.preventDefault(); // ফর্ম সাবমিট বন্ধ করতে
            e.stopPropagation(); // ইভেন্ট প্রপাগেশন বন্ধ করতে
            
            const type = adminPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            adminPassword.setAttribute('type', type);
            
            // আইকন পরিবর্তন
            const icon = this.querySelector('i');
            if (type === 'password') {
                icon.className = 'fas fa-eye';
                icon.style.color = '#1a237e';
            } else {
                icon.className = 'fas fa-eye-slash';
                icon.style.color = '#1a237e';
            }
        });

        // ফর্ম সাবমিটের জন্য এন্টার কী
        adminPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Check admin status
        async function checkAdminStatus(userId, email) {
            try {
                // Admins collection
                try {
                    const adminByEmail = await db.collection('Admins')
                        .where('email', '==', email)
                        .limit(1)
                        .get();
                    if (!adminByEmail.empty) return true;
                } catch (e) {}

                // Registration collection
                try {
                    const userInRegistration = await db.collection('Registration')
                        .where('email', '==', email)
                        .limit(1)
                        .get();
                    if (!userInRegistration.empty) {
                        const userData = userInRegistration.docs[0].data();
                        if (userData.role === 'admin' || userData.userType === 'admin' || userData.isAdmin === true) {
                            return true;
                        }
                    }
                } catch (e) {}

                // Super admin bypass
                const superAdmins = ['admin@nvta.com', 'admin@gmail.com', 'test@test.com'];
                if (email && superAdmins.includes(email.toLowerCase())) {
                    return true;
                }
                return false;
            } catch (error) {
                return false;
            }
        }

        // Admin login
        async function adminLogin(email, password) {
            showLoading();
            hideError();
            hideSuccess();

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const isAdmin = await checkAdminStatus(user.uid, user.email);
                if (!isAdmin) {
                    await auth.signOut();
                    throw new Error('আপনি এডমিন এক্সেস পাচ্ছেন না। শুধুমাত্র অনুমোদিত এডমিনরা প্রবেশ করতে পারেন।');
                }

                // Store session - permanent until logout
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminEmail', user.email);
                localStorage.setItem('adminUid', user.uid);
                localStorage.setItem('sessionToken', 'token_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
                // Remove any auto-logout timer
                localStorage.removeItem('lastLogin'); // we don't need expiry

                hideLoading();
                showSuccess('লগইন সফল! এডমিন প্যানেলে নিয়ে যাওয়া হচ্ছে...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                hideLoading();
                let errorMessageText = 'লগইন ব্যর্থ হয়েছে';
                switch (error.code) {
                    case 'auth/invalid-email': errorMessageText = 'অবৈধ ইমেইল ঠিকানা'; break;
                    case 'auth/user-disabled': errorMessageText = 'এই অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে'; break;
                    case 'auth/user-not-found': errorMessageText = 'এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট নেই'; break;
                    case 'auth/wrong-password': errorMessageText = 'ভুল পাসওয়ার্ড'; break;
                    case 'auth/too-many-requests': errorMessageText = 'অনেকবার চেষ্টা করা হয়েছে, কিছুক্ষণ পর আবার চেষ্টা করুন'; break;
                    default: errorMessageText = error.message || 'লগইন প্রক্রিয়ায় সমস্যা হয়েছে';
                }
                showError(errorMessageText);
            }
        }

        // Session helpers - permanent session (no expiry)
        function isValidSession() {
            const isAdminLoggedIn = localStorage.getItem('adminLoggedIn');
            const adminEmailStored = localStorage.getItem('adminEmail');
            const sessionToken = localStorage.getItem('sessionToken');
            // Only check if logged in flag and token exist, no time expiry
            return (isAdminLoggedIn === 'true' && adminEmailStored && sessionToken);
        }
        function clearSession() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminEmail');
            localStorage.removeItem('adminUid');
            localStorage.removeItem('sessionToken');
        }

        // Auth listener
        let authListenerUnsubscribe = null;
        function setupAuthListener() {
            if (authListenerUnsubscribe) authListenerUnsubscribe();
            authListenerUnsubscribe = auth.onAuthStateChanged(async (user) => {
                if (user && window.location.pathname.includes('login.html')) {
                    // If session is valid, redirect immediately (no expiry)
                    if (isValidSession()) {
                        setTimeout(() => { window.location.href = 'index.html'; }, 100);
                        return;
                    }
                    const isAdmin = await checkAdminStatus(user.uid, user.email);
                    if (isAdmin) {
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminEmail', user.email);
                        localStorage.setItem('adminUid', user.uid);
                        localStorage.setItem('sessionToken', 'token_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
                        setTimeout(() => { window.location.href = 'index.html'; }, 100);
                    } else {
                        await auth.signOut();
                        clearSession();
                    }
                }
            });
        }

        // Check session on load - permanent session
        async function checkSessionOnLoad() {
            try {
                // If session is valid and user is logged in, redirect
                if (isValidSession()) {
                    const currentUser = auth.currentUser;
                    if (currentUser) {
                        // Verify admin status but keep session
                        const isAdmin = await checkAdminStatus(currentUser.uid, currentUser.email);
                        if (isAdmin) {
                            setTimeout(() => { window.location.href = 'index.html'; }, 100);
                            return;
                        } else {
                            await auth.signOut();
                            clearSession();
                        }
                    } else {
                        // User not in auth but session exists - clear it
                        clearSession();
                    }
                } else {
                    clearSession();
                }

                const currentUser = auth.currentUser;
                if (currentUser) {
                    const isAdmin = await checkAdminStatus(currentUser.uid, currentUser.email);
                    if (isAdmin) {
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminEmail', currentUser.email);
                        localStorage.setItem('adminUid', currentUser.uid);
                        localStorage.setItem('sessionToken', 'token_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
                        setTimeout(() => { window.location.href = 'index.html'; }, 100);
                    } else {
                        await auth.signOut();
                        clearSession();
                    }
                }
            } catch (error) {
                clearSession();
                if (auth.currentUser) await auth.signOut();
            }
        }

        // UI messages
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => { hideError(); }, 5000);
        }
        function hideError() { errorMessage.style.display = 'none'; }
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => { hideSuccess(); }, 3000);
        }
        function hideSuccess() { successMessage.style.display = 'none'; }

        // Form submit
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            hideError();
            hideSuccess();

            const email = adminEmail.value.trim();
            const password = adminPassword.value.trim();

            if (!email) { showError('ইমেইল প্রদান করুন'); adminEmail.focus(); return; }
            if (!password) { showError('পাসওয়ার্ড প্রদান করুন'); adminPassword.focus(); return; }
            if (password.length < 6) { showError('পাসওয়ার্ডে অন্তত ৬টি অক্ষর থাকা আবশ্যক'); adminPassword.focus(); return; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { showError('সঠিক ইমেইল ঠিকানা দিন'); adminEmail.focus(); return; }

            await adminLogin(email, password);
        });

        // Initialize
        function initializePage() {
            // Clear any stale session but keep if valid
            // We'll let checkSessionOnLoad handle it
            auth.signOut().catch(() => {});
            setTimeout(() => { checkSessionOnLoad(); }, 300);
            setupAuthListener();
            adminEmail.focus();

            document.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' && !loginBtn.disabled) {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        }

        window.addEventListener('beforeunload', () => {
            if (authListenerUnsubscribe) authListenerUnsubscribe();
        });

        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
